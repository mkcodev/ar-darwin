packages:
  - apps/*
  - packages/*
# Hoisted, no aislado: con el aislado por defecto, apps/mobile depende directamente de
# react-native-vision-camera y react-native-nitro-image, y vision-camera tiene nitro-image como
# peer no opcional; esa dependencia cruzada hacía que pnpm creara dos copias físicas de cada uno
# (mismo contenido, distinto hash de peers) y Metro las empaquetaba las dos, registrando dos veces
# las vistas nativas de vision-camera y Skia. Ver issue #25 y docs.expo.dev/guides/monorepos.
nodeLinker: hoisted
# Solo estos paquetes pueden ejecutar scripts al instalar; lista mínima (`pnpm ignored-builds` sale
# vacío). Skia lo necesita para colocar sus binarios nativos.
allowBuilds:
  '@shopify/react-native-skia': true
# Fuga de memoria de la cámara (issue #62, vision-camera#4180): PRs #4185 y #4186 de vision-camera,
# aún sin publicar, más `session.dispose()` en `useCameraSession`. El parche va atado a la versión
# exacta (apps/mobile la fija sin `^`). Ver docs/spikes/camera.md.
patchedDependencies:
  react-native-vision-camera@5.2.3: patches/react-native-vision-camera@5.2.3.patch

# Retraso de versiones nuevas: pnpm 11 ya no instala versiones con menos de 24 h
# (`minimumReleaseAge: 1440` por defecto). No lo escribas aquí: hacerlo activa
# `minimumReleaseAgeStrict` y pnpm fallaría en vez de quedarse con la versión anterior.
# Para un parche urgente, exceptúa la versión exacta (nunca el paquete entero) y quítala al día
# siguiente:
# minimumReleaseAgeExclude:
#   - expo@57.0.30
