name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to the release's commit SHA; Dependabot (.github/dependabot.yml) keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Every check blocks except the SDK version one: a new Expo patch must not turn CI red.
      # expo-doctor is pinned; bump it by hand when upgrading the Expo SDK.
      - name: Expo doctor
        run: pnpm dlx expo-doctor@1.20.4
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
      - name: Expo SDK patches (warning only)
        working-directory: apps/mobile
        run: |
          pnpm exec expo install --check || echo "::warning title=Expo SDK::Hay parches de Expo pendientes. Ejecuta npx expo install --check en apps/mobile."
